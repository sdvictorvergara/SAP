# Configuración para MariaDB en Docker
spring.datasource.url=jdbc:mariadb://192.168.1.63:3306/sap
spring.datasource.username=root
spring.datasource.password=sap
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Ajustes de JPA y Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Servidor de la aplicación
server.port=9090

# ---------------------------------------------------------------------
# Opcional: lee backend/.env si existe (ya está en el .gitignore) para sobreescribir lo de abajo
spring.config.import=optional:file:.env[.properties]

# Orígenes que pueden usar la API (varios separados por coma). "*" = cualquiera
app.cors.allowed-origins=${CORS_ORIGINS:*}

# Incluir el mensaje en las respuestas de error (el frontend lo muestra en el toast)
server.error.include-message=always
